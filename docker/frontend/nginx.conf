# 菜芦前端容器 nginx 站点配置
#
# 职责：
#   1. 托管前端构建产物（/usr/share/nginx/html）；
#   2. SPA 刷新子路由回落 index.html；
#   3. 业务接口 /api 与健康探针 /health 反代到后端容器（backend:8023）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传接口放宽请求体大小（与后端 [upload].max_size_mb 联动）
    client_max_body_size 50m;

    # 静态资源长缓存；入口不缓存，保证发版即时生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 兜底：刷新任意子路由均返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务接口反代到后端（保留前缀）
    location /api/ {
        proxy_pass http://backend:8023;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8023/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
