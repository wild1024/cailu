# 菜芦通用后台系统 —— 前端 nginx 站点配置
#
# 用途：托管 `pnpm build` 产物（dist/），并把业务接口与健康探针反向代理到后端。
# 放置：复制到 nginx 的 conf.d 目录（如 /etc/nginx/conf.d/cailu-frontend.conf）。
#
# 核心约定：
#   1. 前端是单页应用（SPA），刷新子路由必须回落 index.html；
#   2. 后端统一前缀 `/api`（见 cailu/backend/config/config.toml 的 [router] prefix），
#      这里原样透传，不做前缀改写；
#   3. vite-plugin-compression 已生成 .gz 预压缩产物，开启 gzip_static 直接复用；
#   4. 反代后端时透传 `X-Real-IP` / `X-Forwarded-For`，供后端解析真实客户端 IP；
#      若本 nginx 前方还有 CDN / 代理，需按「多层代理」一节的说明启用 real_ip。

# 后端服务地址：与后端 [server].listen 保持一致
upstream cailu_backend {
    server 127.0.0.1:8023;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 站点根目录：指向前端构建产物（按实际部署路径调整）
    root  /var/www/cailu/frontend/dist;
    index index.html;

    # 上传接口需要放宽请求体大小（与后端上传模块联动）
    client_max_body_size 50m;

    # ---------- 多层代理 / CDN：还原真实客户端 IP（按需启用） ----------
    # 默认拓扑为「客户端 → 本 nginx → 后端」，此时 $remote_addr 即真实客户端 IP，
    # 下面两处 X-Real-IP 已能正确透传，本节无需启用。
    #
    # 仅当本 nginx 前方还有 CDN 或另一层代理时启用：此时 $remote_addr 只是上游代理
    # 的 IP，必须用 ngx_http_realip_module 把 $remote_addr 还原为真实客户端 IP，
    # 再由 X-Real-IP 转发给后端。
    #
    # 安全前提：set_real_ip_from 只列可信代理的来源地址，切勿写成 0.0.0.0/0，
    # 否则客户端可伪造 X-Forwarded-For 冒充任意 IP，绕过后端基于 IP 的登录限流。
    #
    # 场景一：上游为内网代理 / K8s Ingress（私有网段）
    # set_real_ip_from 127.0.0.1;
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 192.168.0.0/16;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;
    #
    # 场景二：上游为 CDN（替换为 CDN 官方回源网段）
    # set_real_ip_from 203.0.113.0/24;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # 直接使用构建阶段生成的 .gz 文件，省去在线压缩
    gzip_static on;

    # ---------- 业务接口：反代后端（保留 /api 前缀） ----------
    location /api/ {
        proxy_pass         http://cailu_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ---------- 健康探针：后端无前缀根路径 ----------
    location = /health {
        proxy_pass         http://cailu_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
    }

    # ---------- 带哈希的静态资源：长缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA 路由回落：非文件、非接口一律交给 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立即拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 隐藏文件与源码映射不外泄
    location ~ /\.(?!well-known) {
        deny all;
    }
}
